<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>GamaPlay Deep Link</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 620px;

            padding: 28px;

            background: #ffffff;
            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;

            font-size: 24px;
        }

        .description {
            margin-bottom: 20px;

            color: #666;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            min-height: 140px;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            resize: vertical;

            font-family: Consolas, monospace;
            font-size: 14px;

            word-break: break-all;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-family: Consolas, monospace;
            font-size: 13px;
        }

        button {
            width: 100%;

            margin-top: 12px;
            padding: 13px;

            border: 0;
            border-radius: 8px;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        .primary {
            background: #ff7a00;
            color: white;
        }

        .secondary {
            background: #eeeeee;
            color: #222;
        }

        .result {
            margin-top: 20px;
            display: none;
        }

        .status {
            text-align: center;
            line-height: 1.7;
        }

        .open-button {
            display: block;

            margin-top: 20px;
            padding: 14px 20px;

            background: #ff7a00;
            color: white;

            border-radius: 8px;

            text-decoration: none;
            text-align: center;

            font-size: 17px;
            font-weight: 600;
        }

        .small {
            margin-top: 16px;

            color: #888;
            font-size: 12px;
            line-height: 1.6;

            word-break: break-all;
        }

        .success {
            margin-top: 10px;

            color: #16863c;
            text-align: center;
            font-size: 14px;
        }

        .error {
            margin-top: 10px;

            color: #c62828;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>


<body>

<div class="card">

    <!-- =========================================
         連結產生器
         ========================================= -->

    <div id="generator">

        <h1>GamaPlay 連結產生器</h1>

        <div class="description">
            貼上 GamaPlay Deep Link，
            系統會產生可透過 LINE、Discord、Messenger
            或其他方式分享的 HTTPS 網址。
        </div>

        <textarea
            id="gameplInput"
            placeholder="gameplapp://gameplhost/deeplink?type=1&action=web&code=..."
        ></textarea>

        <button
            class="primary"
            onclick="generateLink()"
        >
            產生分享連結
        </button>

        <div
            id="inputMessage"
            class="error"
            style="display:none"
        ></div>


        <!-- 產生結果 -->

        <div
            id="resultArea"
            class="result"
        >

            <p>
                產生的 HTTPS 網址：
            </p>

            <input
                id="resultUrl"
                type="text"
                readonly
            >

            <button
                class="secondary"
                onclick="copyLink()"
            >
                複製網址
            </button>

            <div
                id="copyMessage"
                class="success"
                style="display:none"
            >
                已複製網址
            </div>

        </div>

    </div>


    <!-- =========================================
         手機 Deep Link 跳轉頁
         ========================================= -->

    <div
        id="redirect"
        style="display:none"
    >

        <div class="status">

            <h1>正在開啟 GamaPlay...</h1>

            <p>
                正在嘗試開啟 GamaPlay。
            </p>

            <p>
                如果 App 沒有自動開啟，
                請點擊下方按鈕。
            </p>

        </div>


        <a
            id="openApp"
            class="open-button"
            href="#"
        >
            開啟 GamaPlay
        </a>


        <div
            id="targetInfo"
            class="small"
        ></div>

    </div>

</div>


<script>

    /*
     * ============================================
     * GitHub Pages Base URL
     * ============================================
     *
     * 不寫死 bac925.github.io。
     *
     * 假設目前頁面：
     *
     * https://bac925.github.io/gamaplay/
     *
     * 就會自動使用這個網址。
     */

    const BASE_URL =
        window.location.origin +
        window.location.pathname;


    /*
     * ============================================
     * 驗證 GamaPlay Deep Link
     * ============================================
     *
     * 只允許：
     *
     * gameplapp://gameplhost/deeplink?
     *
     * 避免這個網站變成任意 URL Redirector。
     */

    function isValidGameplLink(url) {

        if (!url) {
            return false;
        }

        return url
            .toLowerCase()
            .startsWith(
                "gameplapp://gameplhost/deeplink?"
            );
    }


    /*
     * ============================================
     * 產生分享網址
     * ============================================
     */

    function generateLink() {

        const input =
            document
                .getElementById("gameplInput")
                .value
                .trim();


        const message =
            document.getElementById("inputMessage");


        message.style.display = "none";


        /*
         * 空白
         */

        if (!input) {

            message.textContent =
                "請貼上 GamaPlay Deep Link。";

            message.style.display = "block";

            return;
        }


        /*
         * 格式驗證
         */

        if (!isValidGameplLink(input)) {

            message.textContent =
                "連結格式不正確，必須以 " +
                "gameplapp://gameplhost/deeplink? 開頭。";

            message.style.display = "block";

            return;
        }


        /*
         * ========================================
         * 重要：
         *
         * 原始網址內的 code 本身已經 URL Encode。
         *
         * 例如：
         *
         * %2B
         * %2F
         * %3D
         *
         * 這裡必須把「整條 Deep Link」
         * 再 Encode 一次。
         *
         * 不可以先 decode code。
         * ========================================
         */

        const encoded =
            encodeURIComponent(input);


        const redirectUrl =
            BASE_URL +
            "?url=" +
            encoded;


        document
            .getElementById("resultUrl")
            .value = redirectUrl;


        document
            .getElementById("resultArea")
            .style.display = "block";


        document
            .getElementById("copyMessage")
            .style.display = "none";
    }


    /*
     * ============================================
     * 複製網址
     * ============================================
     */

    async function copyLink() {

        const resultInput =
            document.getElementById("resultUrl");


        const value =
            resultInput.value;


        if (!value) {
            return;
        }


        try {

            /*
             * 新版 Clipboard API
             */

            await navigator.clipboard.writeText(value);

        }
        catch (error) {

            /*
             * 舊瀏覽器 fallback
             */

            resultInput.focus();
            resultInput.select();

            document.execCommand("copy");
        }


        const message =
            document.getElementById("copyMessage");


        message.style.display = "block";


        setTimeout(
            function () {

                message.style.display = "none";

            },
            2000
        );
    }


    /*
     * ============================================
     * Deep Link Redirect
     * ============================================
     */

    function checkRedirect() {

        /*
         * 讀取：
         *
         * ?url=xxxxxxxx
         */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const target =
            params.get("url");


        /*
         * 沒有 ?url
         *
         * 代表目前是產生器模式。
         */

        if (!target) {

            return;
        }


        /*
         * 再做一次安全驗證。
         *
         * 即使有人手動修改網址，
         * 也不能跳到其他 Scheme。
         */

        if (!isValidGameplLink(target)) {

            document
                .getElementById("generator")
                .style.display = "block";


            const message =
                document.getElementById("inputMessage");


            message.textContent =
                "無效的 GamaPlay Deep Link。";


            message.style.display = "block";


            return;
        }


        /*
         * ========================================
         * 切換成 Redirect UI
         * ========================================
         */

        document
            .getElementById("generator")
            .style.display = "none";


        document
            .getElementById("redirect")
            .style.display = "block";


        /*
         * 手動開啟按鈕
         */

        const openButton =
            document.getElementById("openApp");


        openButton.href = target;


        /*
         * 顯示目標網址
         *
         * 如果之後正式發布不想讓使用者看到，
         * 可以直接把下面這段刪掉。
         */

        document
            .getElementById("targetInfo")
            .textContent =
                "Deep Link：" + target;


        /*
         * ========================================
         * 自動嘗試喚起 GamaPlay
         * ========================================
         *
         * 部分手機瀏覽器允許自動開啟。
         *
         * 部分瀏覽器（尤其 App 內建瀏覽器）
         * 可能要求 user gesture。
         *
         * 所以即使自動跳轉失敗，
         * 上面的「開啟 GamaPlay」按鈕仍可使用。
         */

        setTimeout(
            function () {

                window.location.href = target;

            },
            300
        );
    }


    /*
     * ============================================
     * 網頁啟動
     * ============================================
     */

    checkRedirect();

</script>

</body>
</html>
