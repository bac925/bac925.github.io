<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>GamaPlay Link</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 600px;
            padding: 28px;

            background: white;
            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .description {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            min-height: 110px;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            resize: vertical;

            font-family: Consolas, monospace;
            font-size: 14px;
        }

        button {
            width: 100%;

            margin-top: 12px;
            padding: 13px;

            border: 0;
            border-radius: 8px;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        .primary {
            background: #ff7a00;
            color: white;
        }

        .secondary {
            background: #eeeeee;
            color: #222;
        }

        .result {
            margin-top: 20px;
            display: none;
        }

        .result input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-family: Consolas, monospace;
            font-size: 13px;
        }

        .status {
            text-align: center;
            line-height: 1.7;
        }

        .open-button {
            display: block;

            margin-top: 20px;
            padding: 14px 20px;

            background: #ff7a00;
            color: white;

            border-radius: 8px;

            text-decoration: none;
            text-align: center;
            font-weight: 600;
        }

        .small {
            margin-top: 14px;

            color: #888;
            font-size: 13px;
            line-height: 1.6;

            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="card">

    <!--
        =========================================================
        產生連結模式
        =========================================================
    -->
    <div id="generator">

        <h1>GamaPlay 連結產生器</h1>

        <div class="description">
            貼上 gamaplay:// 連結，
            系統會產生可以分享的 HTTPS 跳轉網址。
        </div>

        <textarea
            id="gamaplayInput"
            placeholder="gamaplay://..."
        ></textarea>

        <button
            class="primary"
            onclick="generateLink()"
        >
            產生連結
        </button>

        <div
            id="resultArea"
            class="result"
        >

            <p>產生的網址：</p>

            <input
                id="resultUrl"
                type="text"
                readonly
            >

            <button
                class="secondary"
                onclick="copyLink()"
            >
                複製網址
            </button>

        </div>

    </div>


    <!--
        =========================================================
        手機跳轉模式
        =========================================================
    -->
    <div
        id="redirect"
        style="display:none"
    >

        <div class="status">

            <h1>正在開啟 GamaPlay...</h1>

            <p>
                如果沒有自動開啟，
                請點擊下方按鈕。
            </p>

        </div>

        <a
            id="openApp"
            class="open-button"
            href="#"
        >
            開啟 GamaPlay
        </a>

        <div
            id="targetInfo"
            class="small"
        ></div>

    </div>

</div>


<script>

    /*
     * =========================================================
     * 設定
     * =========================================================
     *
     * 如果你的 GitHub Pages 網址是：
     *
     * https://bac925.github.io/gamaplay/
     *
     * 就維持下面這個設定。
     */

    const BASE_URL =
        "https://bac925.github.io/gamaplay/";


    /*
     * =========================================================
     * 產生 HTTPS 跳轉網址
     * =========================================================
     */

    function generateLink() {

        const input =
            document
                .getElementById("gamaplayInput")
                .value
                .trim();


        if (!input) {

            alert("請輸入 GamaPlay 連結");

            return;
        }


        /*
         * 基本檢查
         */

        if (!input.toLowerCase().startsWith("gamaplay://")) {

            alert(
                "連結格式不正確。\n\n" +
                "必須以 gamaplay:// 開頭。"
            );

            return;
        }


        /*
         * encodeURIComponent 很重要
         *
         * 因為 gamaplay URL 本身可能包含：
         *
         * ?
         * &
         * =
         * +
         *
         * 如果不 encode，
         * 外層 HTTPS Query String 可能會被拆壞。
         */

        const redirectUrl =
            BASE_URL +
            "?url=" +
            encodeURIComponent(input);


        document
            .getElementById("resultUrl")
            .value = redirectUrl;


        document
            .getElementById("resultArea")
            .style.display = "block";
    }


    /*
     * =========================================================
     * 複製網址
     * =========================================================
     */

    async function copyLink() {

        const value =
            document
                .getElementById("resultUrl")
                .value;


        try {

            await navigator.clipboard.writeText(value);

            alert("已複製網址");

        }
        catch {

            /*
             * Clipboard API 被瀏覽器禁止時的 fallback
             */

            const input =
                document.getElementById("resultUrl");

            input.select();

            document.execCommand("copy");

            alert("已複製網址");
        }
    }


    /*
     * =========================================================
     * 判斷目前是不是 Redirect 模式
     * =========================================================
     */

    function checkRedirect() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const target =
            params.get("url");


        /*
         * 沒有 ?url=
         *
         * → 顯示產生器
         */

        if (!target) {

            return;
        }


        /*
         * 安全檢查
         *
         * 只允許 gamaplay://
         *
         * 避免這個 GitHub Pages
         * 被拿去當任意 URL Redirector。
         */

        if (
            !target
                .toLowerCase()
                .startsWith("gamaplay://")
        ) {

            alert("無效的 GamaPlay 連結");

            return;
        }


        /*
         * 切換 UI
         */

        document
            .getElementById("generator")
            .style.display = "none";


        document
            .getElementById("redirect")
            .style.display = "block";


        /*
         * 設定手動按鈕
         */

        const openButton =
            document.getElementById("openApp");

        openButton.href = target;


        /*
         * Debug / 顯示實際目標
         */

        document
            .getElementById("targetInfo")
            .textContent =
                "目標：" + target;


        /*
         * =====================================================
         * 自動嘗試開啟 App
         * =====================================================
         *
         * 某些瀏覽器會允許。
         *
         * iOS Safari / Chrome 等環境
         * 可能要求使用者操作，
         * 所以下面仍然保留按鈕。
         */

        setTimeout(
            function () {

                window.location.href = target;

            },
            300
        );
    }


    /*
     * 網頁載入完成後執行
     */

    checkRedirect();

</script>

</body>
</html>
