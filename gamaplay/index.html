<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="robots" content="noindex, nofollow">

    <title>GamaPlay Deep Link</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 620px;
            padding: 28px;

            background: white;
            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .description {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            resize: vertical;

            font-family: Consolas, monospace;
            font-size: 14px;

            word-break: break-all;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-family: Consolas, monospace;
            font-size: 13px;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;

            border: 0;
            border-radius: 8px;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        .primary {
            background: #ff7a00;
            color: white;
        }

        .secondary {
            background: #eeeeee;
            color: #222;
        }

        .result {
            margin-top: 20px;
            display: none;
        }

        .status {
            text-align: center;
            line-height: 1.7;
        }

        .open-button {
            display: block;

            margin-top: 20px;
            padding: 15px 20px;

            background: #ff7a00;
            color: white;

            border-radius: 8px;

            text-decoration: none;
            text-align: center;

            font-size: 17px;
            font-weight: 600;
        }

        .small {
            margin-top: 16px;

            color: #888;
            font-size: 12px;
            line-height: 1.6;

            word-break: break-all;
        }

        .success {
            margin-top: 10px;

            color: #16863c;
            text-align: center;
            font-size: 14px;
        }

        .error {
            margin-top: 10px;

            color: #c62828;
            text-align: center;
            font-size: 14px;
        }

        .debug {
            margin-top: 20px;
            padding: 12px;

            background: #f2f2f2;
            border-radius: 8px;

            font-family: Consolas, monospace;
            font-size: 11px;

            word-break: break-all;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- ==============================
         產生器
         ============================== -->

    <div id="generator">

        <h1>GamaPlay 連結產生器</h1>

        <div class="description">
            貼上 GamaPlay Deep Link，
            系統會將完整連結轉換成 Base64，
            並放入網址 Fragment (#)。
        </div>

        <textarea
            id="gameplInput"
            placeholder="gameplapp://gameplhost/deeplink?type=1&action=web&code=..."
        ></textarea>

        <button
            class="primary"
            onclick="generateLink()"
        >
            產生分享連結
        </button>

        <div
            id="inputMessage"
            class="error"
            style="display:none"
        ></div>


        <div
            id="resultArea"
            class="result"
        >

            <p>
                產生的 HTTPS 網址：
            </p>

            <input
                id="resultUrl"
                type="text"
                readonly
            >

            <button
                class="secondary"
                onclick="copyLink()"
            >
                複製網址
            </button>

            <div
                id="copyMessage"
                class="success"
                style="display:none"
            >
                已複製網址
            </div>

        </div>

    </div>


    <!-- ==============================
         Redirect 頁面
         ============================== -->

    <div
        id="redirect"
        style="display:none"
    >

        <div class="status">

            <h1>正在開啟 GamaPlay...</h1>

            <p>
                正在嘗試開啟 GamaPlay。
            </p>

            <p>
                如果沒有自動開啟，
                請點擊下方按鈕。
            </p>

        </div>


        <a
            id="openApp"
            class="open-button"
            href="#"
        >
            開啟 GamaPlay
        </a>


        <!--
            測試階段保留 Debug 資訊。
            確認成功後可以刪除。
        -->

        <div
            id="debugInfo"
            class="debug"
        ></div>

    </div>

</div>


<script>

    /*
     * ============================================================
     * Base URL
     * ============================================================
     *
     * 例如：
     *
     * https://bac925.github.io/gamaplay/
     */

    const BASE_URL =
        window.location.origin +
        window.location.pathname;


    /*
     * ============================================================
     * Deep Link 驗證
     * ============================================================
     */

    function isValidGameplLink(url) {

        if (!url) {
            return false;
        }

        return url
            .toLowerCase()
            .startsWith(
                "gameplapp://gameplhost/deeplink?"
            );
    }


    /*
     * ============================================================
     * UTF-8 String → Base64
     * ============================================================
     *
     * 不直接：
     *
     * btoa(str)
     *
     * 因為 btoa 本身主要處理 byte string。
     *
     * TextEncoder 可以先把字串轉成 UTF-8 bytes。
     */

    function stringToBase64(str) {

        const bytes =
            new TextEncoder().encode(str);

        let binary = "";

        for (let i = 0; i < bytes.length; i++) {

            binary +=
                String.fromCharCode(bytes[i]);
        }

        return btoa(binary);
    }


    /*
     * ============================================================
     * Base64 → UTF-8 String
     * ============================================================
     */

    function base64ToString(base64) {

        const binary =
            atob(base64);

        const bytes =
            new Uint8Array(binary.length);


        for (let i = 0; i < binary.length; i++) {

            bytes[i] =
                binary.charCodeAt(i);
        }


        return new TextDecoder().decode(bytes);
    }


    /*
     * ============================================================
     * 產生分享網址
     * ============================================================
     */

    function generateLink() {

        const input =
            document
                .getElementById("gameplInput")
                .value
                .trim();


        const message =
            document.getElementById("inputMessage");


        message.style.display = "none";


        /*
         * 檢查輸入
         */

        if (!input) {

            message.textContent =
                "請貼上 GamaPlay Deep Link。";

            message.style.display = "block";

            return;
        }


        /*
         * Deep Link 格式檢查
         */

        if (!isValidGameplLink(input)) {

            message.textContent =
                "格式錯誤。網址必須以 " +
                "gameplapp://gameplhost/deeplink? 開頭。";

            message.style.display = "block";

            return;
        }


        try {

            /*
             * ========================================
             * 重要
             * ========================================
             *
             * 不修改原始 Deep Link。
             *
             * 不做：
             *
             * decodeURIComponent()
             *
             * 也不重新處理 code。
             *
             * 直接把完整字串轉 Base64。
             */

            const encoded =
                stringToBase64(input);


            /*
             * 使用：
             *
             * https://xxx/#BASE64
             *
             * 而不是：
             *
             * https://xxx/?url=...
             */

            const redirectUrl =
                BASE_URL +
                "#" +
                encoded;


            document
                .getElementById("resultUrl")
                .value = redirectUrl;


            document
                .getElementById("resultArea")
                .style.display = "block";


            document
                .getElementById("copyMessage")
                .style.display = "none";

        }
        catch (error) {

            message.textContent =
                "Base64 編碼失敗：" +
                error.message;

            message.style.display = "block";
        }
    }


    /*
     * ============================================================
     * 複製分享網址
     * ============================================================
     */

    async function copyLink() {

        const resultInput =
            document.getElementById("resultUrl");


        const value =
            resultInput.value;


        if (!value) {
            return;
        }


        try {

            await navigator.clipboard.writeText(value);

        }
        catch (error) {

            resultInput.focus();
            resultInput.select();

            document.execCommand("copy");
        }


        const message =
            document.getElementById("copyMessage");


        message.style.display = "block";


        setTimeout(
            function () {

                message.style.display = "none";

            },
            2000
        );
    }


    /*
     * ============================================================
     * Redirect 模式
     * ============================================================
     */

    function checkRedirect() {

        /*
         * 沒有 #
         *
         * → 普通產生器模式
         */

        if (
            !window.location.hash ||
            window.location.hash.length <= 1
        ) {

            return;
        }


        /*
         * 取得 # 後面的 Base64
         */

        const raw =
            window.location.hash.slice(1);


        let target = "";


        try {

            /*
             * Base64 還原
             */

            target =
                base64ToString(raw);

        }
        catch (error) {

            showInvalidLink(
                "Base64 Decode 失敗：" +
                error.message
            );

            return;
        }


        /*
         * 安全檢查
         */

        if (!isValidGameplLink(target)) {

            showInvalidLink(
                "還原後不是有效的 GamaPlay Deep Link。"
            );

            return;
        }


        /*
         * ========================================
         * 顯示 Redirect UI
         * ========================================
         */

        document
            .getElementById("generator")
            .style.display = "none";


        document
            .getElementById("redirect")
            .style.display = "block";


        /*
         * ========================================
         * 設定手動開啟按鈕
         * ========================================
         */

        const openButton =
            document.getElementById("openApp");


        /*
         * 直接把原始 Deep Link 放進 href。
         *
         * 不重新 encode。
         * 不重新 decode。
         */

        openButton.href = target;


        /*
         * ========================================
         * Debug
         * ========================================
         *
         * 測試 Discord 時先保留。
         */

        document
            .getElementById("debugInfo")
            .textContent =
                "Deep Link decode OK\n\n" +
                target;


        /*
         * ========================================
         * 自動喚起
         * ========================================
         *
         * 故意不使用 setTimeout。
         *
         * 盡可能貼近你提供的參考實作。
         */

        try {

            window.location.href =
                target;

        }
        catch (error) {

            document
                .getElementById("debugInfo")
                .textContent +=
                    "\n\nAuto open error:\n" +
                    error.message;
        }
    }


    /*
     * ============================================================
     * 無效網址
     * ============================================================
     */

    function showInvalidLink(message) {

        document
            .getElementById("generator")
            .style.display = "block";


        const msg =
            document.getElementById("inputMessage");


        msg.textContent = message;

        msg.style.display = "block";
    }


    /*
     * ============================================================
     * Start
     * ============================================================
     */

    checkRedirect();

</script>

</body>
</html>
